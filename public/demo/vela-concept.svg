<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="Illustrative concept can">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dcb8"/><stop offset="1" stop-color="#e9b98a"/>
    </linearGradient>
    <linearGradient id="can" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c94c"/><stop offset=".35" stop-color="#f6e27a"/>
      <stop offset=".62" stop-color="#f4a3b4"/><stop offset="1" stop-color="#e2729a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a6"/><stop offset=".5" stop-color="#eef0f2"/><stop offset="1" stop-color="#8d939a"/>
    </linearGradient>
    <radialGradient id="grape" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd0b8"/><stop offset=".7" stop-color="#f2735a"/><stop offset="1" stop-color="#e2553f"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
