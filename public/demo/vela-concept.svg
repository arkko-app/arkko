    <text x="150" y="62" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="40" fill="#f6e9d8">ARKKO</text>
    <text x="150" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#f6e9d8" letter-spacing="2">BOTANICALS</text>
