    <text x="0" y="0" transform="translate(745 560) rotate(-90)" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="18" fill="#2b1d2a" letter-spacing="3">FUNCTIONAL CITRUS-BOTANICAL</text>
